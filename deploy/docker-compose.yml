# ---------------------------------------------------------------------------
# Mercur marketplace — Dokploy Compose stack
#
# Setup instructions are in deploy/README.md. In short: create a Compose service
# in Dokploy pointing at this repo, set "Compose Path" to
# ./deploy/docker-compose.yml, and paste deploy/.env.example into the
# Environment tab. The domain is configured with the DOMAIN variable below — you
# do not need to add one in Dokploy's Domains tab.
#
# Two variables decide whether this works at all:
#   DOMAIN              the hostname Traefik routes (bare host, no scheme)
#   MERCUR_BACKEND_URL  the origin baked into the panels at BUILD time
# They must agree, scheme included. If the panels are built for
# https://host but you open http://host, every API call fails in the browser
# with "Failed to fetch". Changing MERCUR_BACKEND_URL requires a REBUILD,
# not a restart.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mercur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mercur}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mercur} -d ${POSTGRES_DB:-mercur}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    # Named so `worker` can reuse the exact same image. Both services used to carry
    # their own identical `build:` block, which made Compose build and export the
    # image twice on every single deploy.
    image: ${IMAGE_NAME:-mercur-backend}:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MERCUR_BACKEND_URL: ${MERCUR_BACKEND_URL:?set MERCUR_BACKEND_URL to the full origin the browser will use, e.g. http://api.example.com}
    restart: unless-stopped
    command: ["server"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 9000
      # This container owns migrations; the worker below never runs them.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
      MEDUSA_WORKER_MODE: server
      # sslmode=disable is required for the bundled Postgres: Medusa turns database SSL
      # on when NODE_ENV=production, and this container serves no TLS, so the connection
      # stalls until Medusa's 10s timeout and migrations fail. Set DATABASE_URL yourself
      # to point at a managed Postgres — use sslmode=require there.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-mercur}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mercur}?sslmode=disable}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      # Default to the panels' own origin. The bundled panels are same-origin with
      # the API, so they work either way, but an empty value silently breaks every
      # cross-origin caller (your storefront) long after the deploy looks healthy.
      # Add the storefront origin to STORE_CORS and AUTH_CORS once it exists.
      STORE_CORS: ${STORE_CORS:-${MERCUR_BACKEND_URL}}
      ADMIN_CORS: ${ADMIN_CORS:-${MERCUR_BACKEND_URL}}
      VENDOR_CORS: ${VENDOR_CORS:-${MERCUR_BACKEND_URL}}
      AUTH_CORS: ${AUTH_CORS:-${MERCUR_BACKEND_URL}}
      FILE_BACKEND_URL: ${FILE_BACKEND_URL:-${MERCUR_BACKEND_URL}/static}
      MERCUR_VENDOR_URL: ${MERCUR_VENDOR_URL:-${MERCUR_BACKEND_URL}/seller}
      MERCUR_ADMIN_URL: ${MERCUR_ADMIN_URL:-${MERCUR_BACKEND_URL}/dashboard}
      # No default: there is no storefront in this stack to point at. Password
      # reset emails for customers have no link without it.
      MERCUR_STOREFRONT_URL: ${MERCUR_STOREFRONT_URL:-}
      # Payments. Comma-separated; "stub" takes no real money. The worker needs
      # these too — it runs the capture and daily payout jobs.
      PAYMENTS: ${PAYMENTS:-stub}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PAYOUT_WEBHOOK_SECRET: ${STRIPE_PAYOUT_WEBHOOK_SECRET:-}
      # Serving over plain http? See INSECURE_COOKIES in .env.example — without it
      # the panels cannot log in, because Medusa marks session cookies Secure in
      # production and the browser then never stores them.
      INSECURE_COOKIES: ${INSECURE_COOKIES:-false}
      # Where uploads go: `local` (the uploads volume, the default) or `s3`.
      # See "Storing uploads in S3" in deploy/README.md. The media bucket must be
      # a DIFFERENT bucket from the backups — this one is world-readable.
      FILE_STORAGE: ${FILE_STORAGE:-local}
      S3_FILE_BUCKET: ${S3_FILE_BUCKET:-}
      S3_FILE_PUBLIC_URL: ${S3_FILE_PUBLIC_URL:-}
      S3_FILE_PREFIX: ${S3_FILE_PREFIX:-}
      S3_FILE_ACL: ${S3_FILE_ACL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Email. `none` (default) sends nothing, `local` logs, `resend` delivers.
      # See "Sending email" in deploy/README.md.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      STOREFRONT_REVALIDATE_URL: ${STOREFRONT_REVALIDATE_URL:-}
      STOREFRONT_REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET:-}
    volumes:
      - uploads:/app/static
    stop_grace_period: 30s
    # Declared here, not left to the image's HEALTHCHECK: the OCI image format has
    # no healthcheck field, so BuildKit silently drops the Dockerfile instruction
    # depending on the builder and export format. `depends_on: service_healthy`
    # below reads this one, so it must not depend on how the image was built.
    # start_period covers first-boot migrations on an empty database.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s
    expose:
      - "9000"
    networks:
      - default
      - dokploy-network
    # Dokploy's Traefik routes by container labels. Attaching to dokploy-network
    # is necessary but NOT sufficient — without a router rule Traefik answers every
    # request for this host with its own plain-text "404 page not found".
    # DOMAIN must be the bare hostname, no scheme and no trailing slash.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.${TRAEFIK_ROUTER:-mercur}.loadbalancer.server.port=9000"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-mercur}-web.rule=Host(`${DOMAIN:?set DOMAIN to the bare hostname Traefik should route, e.g. api.example.com}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-mercur}-web.entrypoints=web"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-mercur}-web.service=${TRAEFIK_ROUTER:-mercur}"
      # HTTPS. Harmless before DNS/certificates are ready — the web router keeps
      # serving until the certificate is issued.
      - "traefik.http.routers.${TRAEFIK_ROUTER:-mercur}-websecure.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-mercur}-websecure.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-mercur}-websecure.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-mercur}-websecure.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-mercur}-websecure.service=${TRAEFIK_ROUTER:-mercur}"

  # Background jobs, scheduled jobs and workflow execution. Optional for a small
  # marketplace (set backend's MEDUSA_WORKER_MODE to `shared` and delete this
  # service), but recommended so a long-running job cannot stall HTTP responses.
  worker:
    # Same image as `backend` (built there), different entrypoint role. No `build:`
    # block on purpose — see the comment on backend's `image:`.
    image: ${IMAGE_NAME:-mercur-backend}:latest
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      # service_healthy, not service_started: `backend` owns migrations, and its
      # healthcheck only passes once Medusa is serving — i.e. after they finished.
      # Starting the worker earlier races it against an unmigrated schema.
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MEDUSA_WORKER_MODE: worker
      # sslmode=disable is required for the bundled Postgres: Medusa turns database SSL
      # on when NODE_ENV=production, and this container serves no TLS, so the connection
      # stalls until Medusa's 10s timeout and migrations fail. Set DATABASE_URL yourself
      # to point at a managed Postgres — use sslmode=require there.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-mercur}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mercur}?sslmode=disable}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STORE_CORS: ${STORE_CORS:-${MERCUR_BACKEND_URL}}
      ADMIN_CORS: ${ADMIN_CORS:-${MERCUR_BACKEND_URL}}
      VENDOR_CORS: ${VENDOR_CORS:-${MERCUR_BACKEND_URL}}
      AUTH_CORS: ${AUTH_CORS:-${MERCUR_BACKEND_URL}}
      FILE_BACKEND_URL: ${FILE_BACKEND_URL:-${MERCUR_BACKEND_URL}/static}
      MERCUR_VENDOR_URL: ${MERCUR_VENDOR_URL:-${MERCUR_BACKEND_URL}/seller}
      MERCUR_ADMIN_URL: ${MERCUR_ADMIN_URL:-${MERCUR_BACKEND_URL}/dashboard}
      # No default: there is no storefront in this stack to point at. Password
      # reset emails for customers have no link without it.
      MERCUR_STOREFRONT_URL: ${MERCUR_STOREFRONT_URL:-}
      # Payments. Comma-separated; "stub" takes no real money. The worker needs
      # these too — it runs the capture and daily payout jobs.
      PAYMENTS: ${PAYMENTS:-stub}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PAYOUT_WEBHOOK_SECRET: ${STRIPE_PAYOUT_WEBHOOK_SECRET:-}
      INSECURE_COOKIES: ${INSECURE_COOKIES:-false}
      # The worker loads the same modules as the backend, so the file provider has
      # to be configured identically or background jobs that touch files fail in a
      # way the backend never shows.
      FILE_STORAGE: ${FILE_STORAGE:-local}
      S3_FILE_BUCKET: ${S3_FILE_BUCKET:-}
      S3_FILE_PUBLIC_URL: ${S3_FILE_PUBLIC_URL:-}
      S3_FILE_PREFIX: ${S3_FILE_PREFIX:-}
      S3_FILE_ACL: ${S3_FILE_ACL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Email. `none` (default) sends nothing, `local` logs, `resend` delivers.
      # See "Sending email" in deploy/README.md.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
    volumes:
      - uploads:/app/static
    stop_grace_period: 30s

  # Database backups to S3-compatible storage (RustFS, AWS S3, R2, B2, Spaces).
  # Opt-in: it only starts when COMPOSE_PROFILES=backup is set, so a stack that
  # has not configured a bucket does not run a container that can only fail.
  # See "Backing up to S3" in deploy/README.md.
  backup:
    profiles: ["backup"]
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: ${BACKUP_IMAGE_NAME:-mercur-backup}:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-mercur}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mercur}?sslmode=disable}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      # Plain defaults, not `:?` guards. Compose interpolates every service in the
      # file whether or not its profile is active, so a `:?` here would refuse to
      # parse the stack for everyone who has not configured backups. backup.sh
      # validates these itself and exits with a specific message.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-mercur}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PROVIDER: ${S3_PROVIDER:-Other}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Only used by `backup.sh migrate-uploads`, which copies what the local file
      # provider already wrote into the media bucket and repoints the database.
      S3_FILE_BUCKET: ${S3_FILE_BUCKET:-}
      S3_FILE_PREFIX: ${S3_FILE_PREFIX:-}
      S3_FILE_PUBLIC_URL: ${S3_FILE_PUBLIC_URL:-}
    volumes:
      # Read-only on purpose: the migration copies out of here and must not be
      # able to damage the originals it is copying.
      - uploads:/uploads:ro
    stop_grace_period: 30s

volumes:
  postgres-data:
  redis-data:
  uploads:

networks:
  # Dokploy's Traefik network — required for the domain you attach to `backend`.
  dokploy-network:
    external: true
